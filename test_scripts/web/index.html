<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>JeomJeom 샘플 부동산 상품</title>
    <style>
      :root {
        color-scheme: light;
        --blue: #024ad8;
        --blue-deep: #0e3191;
        --blue-soft: #eef4ff;
        --ink: #1a1a1a;
        --charcoal: #3d3d3d;
        --muted: #636363;
        --line: #e8e8e8;
        --cloud: #f7f7f7;
        --canvas: #ffffff;
        --positive: #17643a;
        --positive-bg: #e8f5ed;
        --candidate: #7a4d00;
        --candidate-bg: #fff4d6;
        --context: #38536f;
        --context-bg: #edf3f7;
        --held: #714042;
        --held-bg: #f7eeee;
        --radius-card: 16px;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--canvas);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
      }
      a { color: var(--blue); text-underline-offset: 3px; }
      a:hover { color: var(--blue-deep); }
      a:focus-visible, button:focus-visible { outline: 3px solid #8bb4ff; outline-offset: 3px; }
      button { font: inherit; }
      p { margin: 0; line-height: 1.5; }
      h1 { margin: 0; font-size: clamp(36px, 4.2vw, 48px); line-height: 1.05; font-weight: 500; letter-spacing: -0.025em; }
      h2 { margin: 0; font-size: 24px; line-height: 1.17; font-weight: 500; }
      h3 { margin: 0; font-size: 18px; line-height: 1.35; font-weight: 500; }
      h4 { margin: 0; font-size: 15px; line-height: 1.4; font-weight: 600; }
      dl, dd { margin: 0; }
      ul { margin: 0; }
      .container { width: min(1180px, calc(100% - 48px)); margin: auto; }
      .site-header { border-bottom: 1px solid var(--line); background: var(--canvas); }
      .topline { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 72px; }
      .brand { color: var(--blue); font-size: 15px; font-weight: 700; text-decoration: none; }
      .sample-flag, .chip, .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        width: fit-content;
        padding: 6px 9px;
        border: 1px solid #bed3f7;
        border-radius: 4px;
        color: var(--blue-deep);
        background: var(--blue-soft);
        font-size: 12px;
        line-height: 1;
        font-weight: 700;
        white-space: nowrap;
      }
      .sample-flag::before, .chip.sample::before { content: "S"; }
      .status.matched { color: var(--positive); background: var(--positive-bg); border-color: #b9ddc8; }
      .status.matched::before { content: "✓"; }
      .status.comparison-candidate { color: var(--candidate); background: var(--candidate-bg); border-color: #ead49b; }
      .status.comparison-candidate::before { content: "↔"; }
      .status.context { color: var(--context); background: var(--context-bg); border-color: #cad8e2; }
      .status.context::before { content: "i"; }
      .status.held { color: var(--held); background: var(--held-bg); border-color: #e3c7c9; }
      .status.held::before { content: "Ⅱ"; }
      .status.neutral, .chip.neutral { color: var(--charcoal); background: var(--cloud); border-color: #d6d6d6; }
      .status.neutral::before { content: "·"; }
      .status.offering::before { content: "●"; }
      .status.liquidated { color: var(--charcoal); background: var(--cloud); border-color: #cfcfcf; }
      .status.liquidated::before { content: "✓"; }
      .status.sample::before { content: "S"; }
      .hero { padding: 64px 0 56px; }
      .eyebrow { margin-bottom: 12px; color: var(--blue); font-size: 14px; font-weight: 700; }
      .lead { max-width: 760px; margin-top: 18px; color: var(--charcoal); font-size: 17px; }
      .notice { max-width: 900px; margin-top: 28px; padding: 16px 18px; border-left: 4px solid var(--blue); background: var(--blue-soft); color: var(--charcoal); font-size: 14px; }
      .page-section { padding: 72px 0; }
      .page-section.cloud, .detail-hero.cloud { background: var(--cloud); }
      .section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 28px; }
      .section-copy, .detail, .meta { color: var(--muted); font-size: 14px; }
      .section-copy { max-width: 720px; margin-top: 8px; }
      .product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .product-card {
        display: flex;
        flex-direction: column;
        min-width: 0;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        color: var(--ink);
        background: var(--canvas);
        text-decoration: none;
      }
      .product-card:hover { border-color: #aac3ef; color: var(--ink); }
      .product-card:focus-visible { border-radius: var(--radius-card); }
      .placeholder { min-height: 132px; padding: 22px; background: linear-gradient(145deg, #f1f4f8, #e5e9ef); }
      .placeholder-region { color: var(--muted); font-size: 13px; }
      .placeholder-use { max-width: 260px; margin-top: 10px; color: var(--charcoal); font-size: 22px; line-height: 1.2; font-weight: 500; }
      .product-body { display: flex; flex: 1; flex-direction: column; gap: 18px; padding: 22px; }
      .card-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
      .card-title { margin-top: 10px; }
      .card-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); }
      .card-facts > div { min-width: 0; }
      .card-facts dt { color: var(--muted); font-size: 12px; }
      .card-facts dd { margin-top: 4px; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
      .card-action { color: var(--blue); font-size: 14px; font-weight: 700; }
      .breadcrumb { display: inline-block; margin-bottom: 32px; font-size: 14px; font-weight: 700; }
      .detail-hero { padding: 40px 0 48px; }
      .detail-title-row { display: flex; justify-content: space-between; align-items: start; gap: 24px; }
      .detail-title-row h1 { max-width: 820px; }
      .detail-subtitle { margin-top: 14px; color: var(--charcoal); font-size: 16px; }
      .overview { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 32px; }
      .overview .wide-panel { grid-column: 1 / -1; }
      .panel, .card {
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: var(--radius-card);
        background: var(--canvas);
      }
      .panel-title { margin-bottom: 18px; }
      .wide-panel .panel-title:not(:first-child) { margin-top: 24px; }
      .fact-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
      .fact-list > div { min-width: 0; }
      .fact-list dt { color: var(--muted); font-size: 12px; }
      .fact-list dd { margin-top: 5px; color: var(--ink); font-size: 15px; line-height: 1.4; overflow-wrap: anywhere; }
      .tabs-shell { padding-bottom: 72px; }
      .tabs { display: flex; gap: 4px; overflow-x: auto; border-bottom: 1px solid #cfcfcf; scrollbar-width: thin; }
      .tab {
        flex: 0 0 auto;
        padding: 14px 16px;
        border: 0;
        border-bottom: 3px solid transparent;
        color: var(--muted);
        background: transparent;
        cursor: pointer;
        font-size: 14px;
        font-weight: 700;
      }
      .tab[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--blue); }
      .tab-panel { padding-top: 32px; }
      .tab-panel[hidden] { display: none; }
      .content-stack { display: grid; gap: 24px; }
      .two-column { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
      .three-column { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .list { padding-left: 20px; color: var(--charcoal); line-height: 1.65; }
      .list li + li { margin-top: 8px; }
      .structure-list { display: grid; gap: 12px; }
      .structure-item { padding-bottom: 12px; border-bottom: 1px solid var(--line); }
      .structure-item:last-child { padding-bottom: 0; border-bottom: 0; }
      .structure-label { margin-bottom: 4px; color: var(--muted); font-size: 12px; }
      .review-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px; border: 1px solid #c8d8f4; border-left: 4px solid var(--blue); background: var(--blue-soft); }
      .review-result { font-size: 26px; line-height: 1.2; font-weight: 600; }
      .review-reason { color: var(--charcoal); font-size: 14px; }
      .review-reason strong { display: block; margin-bottom: 6px; color: var(--ink); }
      .review-question-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
      .review-question { display: flex; flex-direction: column; gap: 14px; min-width: 0; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius-card); background: var(--canvas); }
      .review-question .status { margin-top: auto; }
      .review-question-summary { color: var(--ink); font-size: 14px; line-height: 1.45; }
      .review-question-limit { padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; line-height: 1.45; }
      .price-review { padding: 24px; border: 1px solid #c8d8f4; border-left: 4px solid var(--blue); background: var(--blue-soft); }
      .price-review-head { display: flex; justify-content: space-between; align-items: start; gap: 20px; }
      .price-classification { margin-top: 6px; font-size: 28px; line-height: 1.15; font-weight: 600; }
      .classification-note { margin-top: 7px; color: var(--held); font-size: 13px; font-weight: 700; }
      .price-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 20px 0; }
      .price-metric { padding: 14px; border: 1px solid #d5e0f3; background: var(--canvas); }
      .price-metric strong { display: block; margin-top: 5px; font-size: 18px; font-weight: 600; overflow-wrap: anywhere; }
      .method-details, .source-group { border: 1px solid var(--line); border-radius: 4px; background: var(--canvas); }
      .method-details summary, .source-group summary { padding: 15px 17px; cursor: pointer; font-size: 14px; font-weight: 700; }
      .method-details summary:focus-visible, .source-group summary:focus-visible { outline: 3px solid #8bb4ff; outline-offset: 2px; }
      .method-body, .source-group-body { padding: 0 17px 17px; border-top: 1px solid var(--line); }
      .method-body { padding-top: 16px; }
      .method-warning { margin-bottom: 14px; color: var(--held); font-size: 13px; font-weight: 700; }
      .comparison-table-wrap { overflow-x: auto; border: 1px solid var(--line); }
      .comparison-table { width: 100%; min-width: 760px; border-collapse: collapse; background: var(--canvas); font-size: 13px; }
      .comparison-table th, .comparison-table td { padding: 13px 14px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
      .comparison-table th { color: var(--muted); background: var(--cloud); font-weight: 700; }
      .comparison-table tr:last-child td { border-bottom: 0; }
      .source-groups { display: grid; gap: 12px; }
      .source-group-summary { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      .source-group-summary-text { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
      .source-group-body { padding-top: 17px; }
      .source-separation, .warning-box { padding: 16px 18px; border-left: 4px solid var(--candidate); background: var(--candidate-bg); color: var(--charcoal); font-size: 14px; }
      .source-separation strong, .warning-box strong { color: var(--ink); }
      .evidence-grid, .source-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .evidence-card, .source-card { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
      .evidence-card { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius-card); }
      .evidence-top, .source-top { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
      .source-card { padding: 22px; border: 1px solid var(--line); border-top: 4px solid #b8b8b8; border-radius: var(--radius-card); background: var(--canvas); }
      .source-card.matched { border-top-color: var(--positive); }
      .source-card.comparison-candidate { border-top-color: var(--candidate); }
      .source-card.context { border-top-color: var(--context); }
      .source-card.held { border-top-color: var(--held); }
      .source-role { margin-top: 6px; color: var(--muted); font-size: 13px; }
      .source-facts { padding: 16px; border: 1px solid var(--line); background: var(--cloud); }
      .source-facts .fact-list { gap: 12px 16px; }
      .source-warning { margin-top: 12px; color: var(--held); font-size: 13px; font-weight: 700; }
      .evidence-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .evidence-block { padding-left: 12px; border-left: 3px solid #bfc4ca; }
      .evidence-block.limit { border-left-color: var(--held); }
      .evidence-label { margin-bottom: 4px; color: var(--muted); font-size: 12px; font-weight: 700; }
      .evidence-copy { color: var(--charcoal); font-size: 14px; }
      .metadata { display: grid; gap: 7px; padding-top: 14px; border-top: 1px solid var(--line); }
      .metadata > div { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 10px; }
      .metadata dt { color: var(--muted); font-size: 12px; }
      .metadata dd { color: var(--charcoal); font-size: 13px; overflow-wrap: anywhere; }
      .source-link { align-self: flex-start; margin-top: auto; font-size: 14px; font-weight: 700; }
      .offering-formula { margin-top: 18px; padding: 14px; border: 1px solid #c8d8f4; background: var(--blue-soft); color: var(--blue-deep); font-size: 15px; font-weight: 700; }
      .offering-breakdown { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
      .offering-breakdown > div { padding: 12px; border: 1px solid var(--line); background: var(--cloud); }
      .offering-breakdown dt { color: var(--muted); font-size: 12px; }
      .offering-breakdown dd { margin-top: 5px; font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
      .offering-description { margin-top: 12px; color: var(--held); font-size: 13px; font-weight: 700; }
      .flow { display: grid; gap: 0; border-top: 1px solid var(--line); }
      .flow-item { display: grid; grid-template-columns: 42px 1fr auto; gap: 16px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
      .flow-number { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #bcbcbc; border-radius: 50%; color: var(--muted); font-size: 12px; font-weight: 700; }
      .flow-label { font-size: 14px; }
      .flow-value { text-align: right; font-size: 16px; font-weight: 600; }
      .outcome-box { padding: 22px; border: 1px solid #c8d8f4; background: var(--blue-soft); }
      .outcome-value { margin: 8px 0; font-size: 28px; line-height: 1.15; font-weight: 600; }
      .outcome-flags { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
      .reconcile { margin-top: 14px; color: var(--positive); font-size: 14px; font-weight: 700; }
      .cause-card { padding: 20px; border: 1px solid var(--line); border-radius: var(--radius-card); }
      .cause-item { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
      .direction { margin: 8px 0; color: var(--muted); font-size: 12px; font-weight: 700; }
      .operator-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 18px 0; }
      .operator-stat { padding: 14px; border: 1px solid var(--line); background: var(--cloud); }
      .operator-stat strong { display: block; margin-top: 5px; font-size: 22px; font-weight: 600; }
      .linked-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .linked-card { display: block; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius-card); color: var(--ink); text-decoration: none; }
      .linked-card:hover { border-color: #aac3ef; color: var(--ink); }
      .linked-card .meta { margin-top: 8px; }
      .error-state { min-height: 60vh; padding: 80px 0; }
      .error-state p { max-width: 650px; margin: 16px 0 24px; color: var(--charcoal); }
      .button-link { display: inline-block; padding: 11px 15px; border-radius: 4px; color: #fff; background: var(--blue); font-size: 14px; font-weight: 700; text-decoration: none; }
      .button-link:hover { color: #fff; background: var(--blue-deep); }
      .loading { min-height: 55vh; padding: 80px 0; color: var(--muted); }
      footer { padding: 34px 24px; color: #fff; background: var(--ink); text-align: center; font-size: 13px; }

      @media (max-width: 900px) {
        .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .three-column { grid-template-columns: 1fr; }
        .review-question-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .price-metrics, .offering-breakdown { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }

      @media (max-width: 720px) {
        .container { width: min(100% - 32px, 1180px); }
        .hero { padding: 48px 0; }
        .page-section { padding: 48px 0; }
        .section-head, .detail-title-row { display: grid; }
        .product-grid, .overview, .two-column, .review-summary, .evidence-grid, .source-grid, .review-question-grid { grid-template-columns: 1fr; }
        .detail-hero { padding-top: 28px; }
        .fact-list, .evidence-pair { grid-template-columns: 1fr; }
        .operator-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .linked-grid { grid-template-columns: 1fr; }
      }

      @media (max-width: 420px) {
        .topline { align-items: flex-start; min-height: 88px; padding: 18px 0; }
        .sample-flag { white-space: normal; }
        .card-top, .evidence-top, .source-top { display: grid; }
        .card-facts { grid-template-columns: 1fr; }
        .flow-item { grid-template-columns: 34px minmax(0, 1fr); }
        .flow-value { grid-column: 2; text-align: left; }
        .metadata > div { grid-template-columns: 72px minmax(0, 1fr); }
        .price-review-head, .source-group-summary { display: grid; }
        .price-metrics, .offering-breakdown { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container topline">
        <a class="brand" href="./">JeomJeom · 부동산 검토</a>
        <span class="sample-flag">실제 상품 아님 · 전체 샘플</span>
      </div>
    </header>
    <main id="app">
      <div class="container loading" aria-live="polite">샘플 상품 데이터를 불러오는 중입니다.</div>
    </main>
    <footer>JeomJeom test_scripts · 운영 서비스와 분리된 정적 샘플 검증 화면</footer>

    <script>
      const app = document.querySelector("#app");
      const won = new Intl.NumberFormat("ko-KR", { style: "currency", currency: "KRW", maximumFractionDigits: 0 });
      const statusMeta = {
        offering: { label: "진행 중", className: "offering" },
        liquidated: { label: "투자 종료", className: "liquidated" },
        confirmed: { label: "확인", className: "matched" },
        candidate: { label: "1차 후보", className: "comparison-candidate" },
        sample: { label: "샘플 검토", className: "sample" },
        matched: { label: "정확히 일치", className: "matched" },
        comparison_candidate: { label: "비교 후보", className: "comparison-candidate" },
        context: { label: "참고 맥락", className: "context" },
        held: { label: "판정 보류", className: "held" },
      };

      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const list = (value) => Array.isArray(value) ? value : [];
      const known = (value) => value === null || value === undefined || value === "" ? "미확인" : String(value);
      const money = (value) => typeof value === "number" && Number.isFinite(value) ? won.format(value) : "미확인";
      const area = (value) => typeof value === "number" && Number.isFinite(value) ? `${value.toLocaleString("ko-KR")}㎡` : "미확인";
      const pct = (value) => typeof value === "number" && Number.isFinite(value) ? `${value > 0 ? "+" : ""}${value.toLocaleString("ko-KR")}%` : "미확인";
      const months = (value) => typeof value === "number" && Number.isFinite(value) ? `${value.toLocaleString("ko-KR")}개월` : "미확인";
      const formatDateTime = (value) => {
        if (!value) return "미확인";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString("ko-KR", { timeZone: "Asia/Seoul", dateStyle: "medium", timeStyle: "short" });
      };
      const safeHttps = (value) => {
        try {
          const url = new URL(value);
          return url.protocol === "https:" ? url.href : null;
        } catch { return null; }
      };
      const triState = (value, whenTrue, whenFalse, whenUnknown) => value === true ? whenTrue : value === false ? whenFalse : whenUnknown;
      const dataState = (value) => triState(value, "샘플 입력", "실제 API 수신", "수신 확인 불가");
      const linkageState = (value) => triState(value, "가상 연결", "미연결", "연결 미확인");
      const productHref = (id) => `?product=${encodeURIComponent(known(id))}`;
      const statusChip = (status, label) => {
        const meta = statusMeta[status];
        return el("span", `status ${meta?.className || "neutral"}`, label || meta?.label || "미확인");
      };
      const sampleChip = (text = "샘플 상품") => el("span", "chip sample", text);
      const addFact = (root, label, value) => {
        const group = el("div", "");
        group.append(el("dt", "", label), el("dd", "", known(value)));
        root.append(group);
      };
      const makeFactList = (facts, className = "fact-list") => {
        const root = document.createElement("dl");
        root.className = className;
        facts.forEach(([label, value]) => addFact(root, label, value));
        return root;
      };

        section.append(flow, makeFactList([["예상 운용기간", months(performance.expected_operation_months)], ["실제 운용기간", months(performance.actual_operation_months)], ["매각일", performance.sale_date], ["청산일", performance.liquidation_date]]));
        if (outcome.unreconciled_amount_krw === 0) section.append(el("p", "reconcile", "✓ 가상 시나리오 내부 정산식 일치 · 실제 증빙 검증 아님"));
        else section.append(el("p", "source-warning", `시나리오 미정산 차이: ${money(outcome.unreconciled_amount_krw)}`));
        return section;
      };

      const outcomePanel = (product) => {
        const outcome = product.outcome || {};
        const box = el("section", "outcome-box");
        box.append(el("p", "meta", known(outcome.metric_name)), el("p", "outcome-value", pct(outcome.realized_profit_loss_pct)), el("p", "detail", `단순 누적 회수손익 ${money(outcome.realized_profit_loss_krw)}`));
        const flags = el("div", "outcome-flags");
        flags.append(el("span", "chip neutral", outcome.annualized ? "연환산" : "비연환산"), el("span", "chip neutral", outcome.irr ? "IRR" : "비IRR"), el("span", "chip neutral", outcome.cashflow_timing_reflected ? "현금흐름 시점 반영" : "현금흐름 시점 미반영"), el("span", "chip neutral", `개인세금 기준 ${known(outcome.tax_basis)}`));
        box.append(flags, el("p", "review-reason", known(outcome.limitation)), el("p", "meta", known(outcome.note)));
        return box;
      };

      const causePanels = (product) => {
        const causes = product.cause_candidates || {};
        const section = el("section", "content-stack");
        section.append(sectionHeading("결과 원인 후보", "방향은 설명을 돕는 보조정보이며 기여도·점수·귀속 판정이 아닙니다."), el("p", "warning-box", "인과 미확정 · 요인끼리 겹칠 수 있음 · 합산 금지"), el("p", "detail", known(causes.notice)));
        const grid = el("div", "three-column");
        [["사업자 요인 가설", causes.operator], ["자산 요인 가설", causes.asset], ["외부 요인 가설", causes.external]].forEach(([title, items]) => {
          const card = el("article", "cause-card");
          card.append(el("h3", "", title));
          (list(items).length ? list(items) : [{}]).forEach((item) => {
            const body = el("div", "cause-item");
            body.append(el("h4", "", known(item.candidate)), el("p", "direction", `방향 메모: ${known(item.direction)} · 확신도 ${known(item.confidence)}`), el("p", "detail", `관찰: ${known(item.related_observation)}`), el("p", "meta", `한계: ${known(item.limitations)}`));
            card.append(body);
          });
          grid.append(card);
        });
        section.append(grid);
        return section;
      };

      const renderHistory = (product, data, byId) => {
        const stack = el("div", "content-stack");
        if (product.status === "liquidated") stack.append(performancePanel(product), outcomePanel(product), causePanels(product));
        else {
          const linked = el("section", "panel");
          linked.append(el("h2", "panel-title", "같은 가상 운영사의 종료 상품"), el("p", "detail", known(product.operator_history?.note)));
          const grid = el("div", "linked-grid");
          const products = list(product.operator_history?.referenced_product_ids).map((id) => byId.get(id)).filter(Boolean);
          (products.length ? products : []).forEach((item) => grid.append(productCard(item, true)));
          if (!products.length) grid.append(el("p", "detail", "연결된 가상 종료 상품이 없습니다."));
          linked.append(grid);
          stack.append(linked);
        }
        stack.append(operatorSummaryPanel(product, data));
        return stack;
      };

      const renderSourcesAndLimits = (product, data, isPrimary) => {
        const stack = el("div", "content-stack");
        const productSource = el("section", "panel");
        productSource.append(el("h2", "panel-title", "상품 출처 상태"), makeFactList([["상품 입력 상태", product.source_status], ["상품 문서", safeHttps(product.document_url) ? "HTTPS 원문 연결" : "미확인"], ["상품 ID", product.product_id], ["공개 API 상세", isPrimary ? "첫 진행 샘플의 가상 연결 결과 제공" : "해당 샘플에는 미연결"]]));
        const documentHref = safeHttps(product.document_url);
        if (documentHref) {
          const link = el("a", "source-link", "상품 문서 새 창에서 열기 ↗");
          link.href = documentHref;
          link.target = "_blank";
          link.rel = "noreferrer";
          productSource.append(link);
        }
        const limits = el("section", "panel");
        limits.append(el("h2", "panel-title", "공통 한계"));
        const limitations = el("ul", "list");
        (list(data.limitations).length ? list(data.limitations) : ["미확인"]).forEach((item) => limitations.append(el("li", "", known(item))));
        limits.append(limitations);
        stack.append(productSource, limits);
        return stack;
      };

      const setupTabs = (tabs, panels) => {
        const activate = (index, focus = false) => {
          tabs.forEach((tab, tabIndex) => {
            const active = tabIndex === index;
            tab.setAttribute("aria-selected", String(active));
            tab.tabIndex = active ? 0 : -1;
            panels[tabIndex].hidden = !active;
          });
          if (focus) tabs[index].focus();
        };
        tabs.forEach((tab, index) => {
          tab.addEventListener("click", () => activate(index));
          tab.addEventListener("keydown", (event) => {
            let next = index;
            if (event.key === "ArrowRight") next = (index + 1) % tabs.length;
            else if (event.key === "ArrowLeft") next = (index - 1 + tabs.length) % tabs.length;
            else if (event.key === "Home") next = 0;
            else if (event.key === "End") next = tabs.length - 1;
            else return;
            event.preventDefault();
            activate(next, true);
          });
        });
        activate(0);
      };

      const renderDetail = (product, data, byId) => {
        document.title = `${known(product.asset_name)} · JeomJeom 샘플`;
        app.replaceChildren();
        const hero = el("section", "detail-hero cloud");
        const inner = el("div", "container");
        const back = el("a", "breadcrumb", "← 샘플 상품 목록");
        back.href = "./";
        const titleRow = el("div", "detail-title-row");
        const title = el("div", "");
        title.append(el("p", "eyebrow", `${statusLabel(product)} · ${known(product.operator)}`), el("h1", "", known(product.asset_name)), el("p", "detail-subtitle", `${known(product.basic_info?.region)} · ${known(product.basic_info?.building_use)}`));
        titleRow.append(title, sampleChip("실제 상품 아님 · 샘플"));
        const overview = el("div", "overview");
        overview.append(
          overviewPanel("건물 기본 정보", [["지역", product.basic_info?.region], ["건물 용도", product.basic_info?.building_use], ["토지면적", area(product.basic_info?.land_area_m2)], ["연면적", area(product.basic_info?.gross_floor_area_m2)], ["층수", product.basic_info?.floors], ["사용승인일", product.basic_info?.use_approval_date]]),
          offeringOverviewPanel(product)
        );
        const leaseStructure = overviewPanel("임대·상품 구조", [["임차인 유형", product.lease?.main_tenant_type], ["임대율", product.lease?.occupancy_rate_text], ["임대차 만기", product.lease?.lease_expiry], ["신탁", product.structure?.trustee], ["계좌 관리", product.structure?.account_manager], ["운영", product.structure?.operator_role], ["분배 구조", product.structure?.distribution_basis]]);
        leaseStructure.classList.add("wide-panel");
        const topRisks = el("ul", "list");
        (list(product.risks).length ? list(product.risks) : ["미확인"]).forEach((risk) => topRisks.append(el("li", "", known(risk))));
        leaseStructure.append(el("h3", "panel-title", "주요 위험"), topRisks);
        overview.append(leaseStructure);
        inner.append(back, titleRow, overview);
        hero.append(inner);
        app.append(hero);

        const shell = el("section", "tabs-shell");
        const shellInner = el("div", "container");
        const tabList = el("div", "tabs");
        tabList.setAttribute("role", "tablist");
        tabList.setAttribute("aria-label", "상품 상세 영역");
        const definitions = [
          ["상품 정보", renderProductInfo(product)],
          ["JeomJeom 근거 검토", renderEvidence(product, data, product.product_id === list(data.products?.offering)[0]?.product_id)],
          ["과거 성과·운영사", renderHistory(product, data, byId)],
          ["출처·한계", renderSourcesAndLimits(product, data, product.product_id === list(data.products?.offering)[0]?.product_id)],
        ];
        const tabs = [];
        const panels = [];
        definitions.forEach(([label, content], index) => {
          const tab = el("button", "tab", label);
          const panel = el("section", "tab-panel");
          tab.type = "button";
          tab.id = `tab-${index}`;
          tab.setAttribute("role", "tab");
          tab.setAttribute("aria-controls", `panel-${index}`);
          panel.id = `panel-${index}`;
          panel.setAttribute("role", "tabpanel");
          panel.setAttribute("aria-labelledby", tab.id);
          panel.append(content);
          tabList.append(tab);
          shellInner.append(panel);
          tabs.push(tab);
          panels.push(panel);
        });
        shellInner.prepend(tabList);
        shell.append(shellInner);
        app.append(shell);
        setupTabs(tabs, panels);
      };

      const renderNotFound = (id) => {
        document.title = "상품을 찾을 수 없음 · JeomJeom";
        app.replaceChildren();
        const section = el("section", "error-state");
        const inner = el("div", "container");
        inner.append(sampleChip("샘플 데모"), el("h1", "card-title", "상품을 찾을 수 없습니다"), el("p", "", `요청한 상품 ID “${known(id)}”가 현재 샘플 목록에 없습니다.`));
        const link = el("a", "button-link", "상품 목록으로 돌아가기");
        link.href = "./";
        inner.append(link);
        section.append(inner);
        app.append(section);
      };

      fetch("./demo_payload.json", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) throw new Error(`데모 데이터 응답 오류: ${response.status}`);
          return response.json();
        })
        .then((data) => {
          const products = [...list(data.products?.offering), ...list(data.products?.liquidated)];
          const byId = new Map(products.map((product) => [product.product_id, product]));
          const productId = new URLSearchParams(window.location.search).get("product");
          if (!productId) renderList(data);
          else if (byId.has(productId)) renderDetail(byId.get(productId), data, byId);
          else renderNotFound(productId);
        })
        .catch((error) => {
          document.title = "데모 데이터 오류 · JeomJeom";
          app.replaceChildren();
          const state = el("section", "error-state");
          const inner = el("div", "container");
          inner.append(el("h1", "", "데모 데이터를 불러오지 못했습니다"), el("p", "", `${error.message}. 먼저 build_demo.py를 실행하세요.`));
          state.append(inner);
          app.append(state);
        });
    </script>
  </body>
</html>
